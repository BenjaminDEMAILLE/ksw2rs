[package]
name = "ksw2rs"
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
authors = ["ksw2rs contributors"]
description = "Native Rust port of ksw2 (ksw2_extz2_sse) with stable-Rust SIMD backends"
license = "BSD-3-Clause"
repository = "https://github.com/COMBINE-lab/ksw2rs"
homepage = "https://github.com/COMBINE-lab/ksw2rs"
readme = "README.md"
keywords = ["bioinformatics", "alignment", "simd", "ksw2", "sequence-alignment"]
categories = ["science", "algorithms"]

[features]
# Experiment: on x86 use the unaligned whole-chunk score fill (as on aarch64)
# instead of the block-aligned one, to compare the two on real x86 hardware.
x86-unaligned-fill = []

[dependencies]

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "extz2"
harness = false
